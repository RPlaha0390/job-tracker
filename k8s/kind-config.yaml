# Local cluster: 1 control-plane + 2 workers, with ports 80/443 mapped to your
# machine so the ingress is reachable at http://job-tracker.localtest.me
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: job-tracker
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }
      - { containerPort: 443, hostPort: 443, protocol: TCP }
  - role: worker
  - role: worker
